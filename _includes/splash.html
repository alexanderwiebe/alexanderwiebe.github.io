<style>
#splash-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  opacity: 1;
}
#splash-overlay.is-open { display: flex; }
#splash-overlay.is-leaving { opacity: 0; transition: opacity 0.45s ease; }

.splash-row {
  --item-h: 3.25rem;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 24px;
}
.splash-by {
  font-family: var(--mono);
  font-size: 0.9375rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-muted);
  white-space: nowrap;
}
.splash-window {
  position: relative;
  height: calc(var(--item-h) * 3);
  overflow: hidden;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 33.33%, #000 66.66%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 33.33%, #000 66.66%, transparent 100%);
}
.splash-window::after {
  content: "";
  position: absolute;
  top: 50%;
  right: -13px;
  transform: translateY(-50%);
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  border-right: 8px solid var(--accent);
}
.splash-reel {
  display: flex;
  flex-direction: column;
  will-change: transform;
}
.splash-item {
  height: var(--item-h);
  display: flex;
  align-items: center;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 2.25rem;
  letter-spacing: -0.01em;
  color: var(--ink);
  white-space: nowrap;
}
.splash-item.splash-final { color: var(--accent); }

.splash-hint {
  position: absolute;
  bottom: 40px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  opacity: 0;
  animation: splash-hint-in 0.6s ease 1s forwards;
}
@keyframes splash-hint-in {
  to { opacity: 0.7; }
}

#splash-replay {
  all: unset;
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 500;
  font-family: var(--mono);
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 6px 8px;
}
#splash-replay:hover { color: var(--accent); }

@media (max-width: 480px) {
  .splash-row { --item-h: 2.4rem; }
  .splash-by { font-size: 0.75rem; }
  .splash-item { font-size: 1.5rem; }
}
</style>

<div id="splash-overlay" aria-hidden="true">
  <div class="splash-row">
    <span class="splash-window">
      <span class="splash-reel" id="splash-reel"></span>
    </span>
    <span class="splash-by">by AJ</span>
  </div>
  <div class="splash-hint">click to skip</div>
</div>
<button type="button" id="splash-replay" title="Replay intro">by AJ</button>

<script>
(function () {
  var WORDS = [
    "Software", "Solutions", "Architecture", "Angular", "NestJS", "TypeScript",
    "Ontologies", "Knowledge Graphs", "AI Agents", "Neurosymbolic AI",
    "Research", "Consulting", "Engineering", "Enterprise", "Delivery", "Leadership"
  ];
  var FINAL_WORD = "Systems";
  var LOOPS = 6;
  var SPIN_MS = 2800;
  var STORAGE_KEY = "splashSeen";

  var overlay = document.getElementById("splash-overlay");
  var reel = document.getElementById("splash-reel");
  var replayBtn = document.getElementById("splash-replay");
  if (!overlay || !reel || !replayBtn) return;

  var itemHeight = 0;
  var target = 0;
  var running = false;
  var animId = null;

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildReel() {
    reel.innerHTML = "";
    reel.style.transition = "none";
    reel.style.transform = "translateY(0px)";
    for (var i = 0; i < LOOPS; i++) {
      var order = shuffled(WORDS);
      for (var j = 0; j < order.length; j++) {
        var el = document.createElement("span");
        el.className = "splash-item";
        el.textContent = order[j];
        reel.appendChild(el);
      }
    }
    var finalEl = document.createElement("span");
    finalEl.className = "splash-item splash-final";
    finalEl.textContent = FINAL_WORD;
    reel.appendChild(finalEl);
  }

  function easeOutQuint(t) {
    return 1 - Math.pow(1 - t, 5);
  }

  function finish() {
    running = false;
    window.setTimeout(function () {
      overlay.classList.add("is-leaving");
      window.setTimeout(function () {
        overlay.classList.remove("is-open", "is-leaving");
        overlay.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }, 450);
    }, 650);
  }

  function skip() {
    if (!running) return;
    running = false;
    if (animId) cancelAnimationFrame(animId);
    reel.style.transform = "translateY(" + target + "px)";
    finish();
  }

  function play() {
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    overlay.classList.remove("is-leaving");
    overlay.classList.add("is-open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    buildReel();

    requestAnimationFrame(function () {
      var first = reel.querySelector(".splash-item");
      itemHeight = first ? first.getBoundingClientRect().height : 0;
      var items = reel.querySelectorAll(".splash-item").length;
      target = -(itemHeight * (items - 2));

      if (reduceMotion) {
        reel.style.transform = "translateY(" + target + "px)";
        finish();
        return;
      }

      running = true;
      var start = null;

      function frame(ts) {
        if (!running) return;
        if (start === null) start = ts;
        var elapsed = ts - start;
        var t = Math.min(elapsed / SPIN_MS, 1);
        var eased = easeOutQuint(t);
        reel.style.transform = "translateY(" + (target * eased) + "px)";

        if (t < 1) {
          animId = requestAnimationFrame(frame);
        } else {
          finish();
        }
      }
      animId = requestAnimationFrame(frame);
    });
  }

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay || e.target.closest(".splash-row")) skip();
  });

  replayBtn.addEventListener("click", function () {
    play();
  });

  try {
    if (!localStorage.getItem(STORAGE_KEY)) {
      localStorage.setItem(STORAGE_KEY, "1");
      play();
    }
  } catch (e) {
    play();
  }
})();
</script>
