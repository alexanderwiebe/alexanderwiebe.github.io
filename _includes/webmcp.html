<script>
// WebMCP: exposes this site's public content as tools for in-browser AI agents.
// Tools read the site's own published pages, so they stay in sync with the .qmd sources.
// Spec/docs: https://developer.chrome.com/docs/ai/webmcp
//
// The same tools are also callable from page JavaScript in any browser, with or without WebMCP:
//   window.siteTools.list()                      -> tool names, descriptions, input schemas
//   await window.siteTools.call(name, input)     -> JSON string, same as the WebMCP result
//   window.siteTools.webmcp                      -> which API registered the tools, if any
// <html data-webmcp="..."> shows the status: registered, partial, failed or unavailable.
(function () {
  var api = document.modelContext ? 'document.modelContext' : navigator.modelContext ? 'navigator.modelContext' : null;
  var mc = document.modelContext || navigator.modelContext;
  var canRegister = !!(mc && typeof mc.registerTool === 'function');

  var SITE_NAME = 'AJ Wiebe';
  var SOURCE_REPO = 'https://github.com/alexanderwiebe/alexanderwiebe.github.io';
  var LINKS = {
    linkedin: 'https://www.linkedin.com/in/softwarebyaj',
    github: 'https://github.com/alexanderwiebe'
  };
  var PAGES = [
    { path: '/index.html', name: 'Home' },
    { path: '/about.html', name: 'About' },
    { path: '/resume.html', name: 'Résumé' },
    { path: '/research.html', name: 'Research' },
    { path: '/projects/index.html', name: 'Projects' },
    { path: '/writing/index.html', name: 'Writing' }
  ];
  var cache = {};

  function clean(s) {
    return (s || '').replace(/\s+/g, ' ').trim();
  }

  function text(el) {
    if (!el) return '';
    var copy = el.cloneNode(true);
    copy.querySelectorAll('svg, script, style').forEach(function (n) { n.remove(); });
    copy.querySelectorAll('br').forEach(function (n) { n.replaceWith(' '); });
    return clean(copy.textContent);
  }

  function absUrl(href) {
    return new URL(href, location.origin).href;
  }

  // "/", "/index.html" and "/projects/", "/projects/index.html" are the same page.
  function normPath(path) {
    var p = new URL(path, location.origin).pathname;
    return p.endsWith('/') ? p + 'index.html' : p;
  }

  function prettyUrl(path) {
    return absUrl(normPath(path).replace(/index\.html$/, ''));
  }

  function loadPage(path) {
    var key = normPath(path);
    if (key === normPath(location.pathname)) return Promise.resolve(document);
    if (!cache[key]) {
      cache[key] = fetch(key, { credentials: 'same-origin' }).then(function (res) {
        if (!res.ok) throw new Error('Could not load ' + key + ' (HTTP ' + res.status + ')');
        return res.text();
      }).then(function (html) {
        return new DOMParser().parseFromString(html, 'text/html');
      });
      cache[key].catch(function () { delete cache[key]; });
    }
    return cache[key];
  }

  function pageDescription(doc) {
    var meta = doc.querySelector('meta[name="description"]');
    return clean(meta && meta.getAttribute('content')) || text(doc.querySelector('.dek'));
  }

  // Splits a page's .wrap into sections headed by .section-label or h2.h2.
  function sections(doc) {
    var wrap = doc.querySelector('.wrap');
    var out = [];
    var current = { heading: null, items: [] };
    if (!wrap) return out;
    Array.prototype.forEach.call(wrap.children, function (el) {
      if (el.matches('.masthead, .crumb, h1.title, .dek, svg, style, script')) return;
      if (el.matches('.section-label, h2.h2')) {
        if (current.heading || current.items.length) out.push(current);
        current = { heading: text(el), items: [] };
        return;
      }
      var t = text(el);
      if (t) current.items.push(t);
    });
    if (current.heading || current.items.length) out.push(current);
    return out;
  }

  function pageContent(doc, path) {
    return {
      title: clean(doc.title),
      url: prettyUrl(path),
      summary: text(doc.querySelector('.dek')) || pageDescription(doc),
      sections: sections(doc)
    };
  }

  function listProjects() {
    return loadPage('/projects/index.html').then(function (doc) {
      return Array.prototype.map.call(doc.querySelectorAll('.project-row'), function (row) {
        var link = row.querySelector('.row-title');
        var url = absUrl(link.getAttribute('href'));
        var slug = new URL(url).pathname.replace(/^\/projects\//, '').replace(/\.html$/, '');
        return { slug: slug, title: text(link), description: text(row.querySelector('.row-desc')), url: url };
      });
    });
  }

  function getExperience() {
    return loadPage('/resume.html').then(function (doc) {
      var result = { experience: [], education: [], fullHistory: LINKS.linkedin };
      var section = null;
      Array.prototype.forEach.call(doc.querySelector('.wrap').children, function (el) {
        if (el.matches('.section-label')) section = text(el).toLowerCase();
        if (!el.matches('.pub-row')) return;
        var entry = {
          dates: text(el.querySelector('.pub-meta')),
          title: text(el.querySelector('.pub-title')),
          description: text(el.querySelector('.pub-authors'))
        };
        if (section === 'education') result.education.push(entry);
        else result.experience.push(entry);
      });
      return result;
    });
  }

  function getResearch() {
    return loadPage('/research.html').then(function (doc) {
      var pubs = Array.prototype.map.call(doc.querySelectorAll('.pub-row'), function (row) {
        var meta = row.querySelector('.pub-meta').innerHTML.split(/<br\s*\/?>/i).map(function (s) {
          return clean(s.replace(/<[^>]+>/g, ''));
        });
        var link = row.querySelector('.pub-title a');
        return {
          year: meta[0],
          venue: meta[1] || null,
          title: text(row.querySelector('.pub-title')),
          details: text(row.querySelector('.pub-authors')),
          url: link ? absUrl(link.getAttribute('href')) : null
        };
      });
      var topics = Array.prototype.map.call(doc.querySelectorAll('.topic-list li'), text);
      return { summary: text(doc.querySelector('.wrap > p')), publications: pubs, currentTopics: topics };
    });
  }

  function getBio() {
    return loadPage('/about.html').then(function (doc) {
      return {
        name: SITE_NAME,
        role: text(doc.querySelector('.masthead .role')),
        summary: text(doc.querySelector('.dek')),
        bio: sections(doc)
      };
    });
  }

  function siteMap() {
    return Promise.all(PAGES.map(function (page) {
      return loadPage(page.path).then(function (doc) {
        return { name: page.name, url: prettyUrl(page.path), description: pageDescription(doc) };
      }, function () {
        return { name: page.name, url: prettyUrl(page.path), description: null };
      });
    }));
  }

  function findProject(projects, query) {
    var norm = function (s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); };
    var q = norm(query);
    if (!q) return null;
    var exact = projects.filter(function (p) { return norm(p.slug) === q || norm(p.title) === q; })[0];
    if (exact) return exact;
    return projects.filter(function (p) {
      var hay = norm(p.slug) + ' ' + norm(p.title);
      return hay.indexOf(q) !== -1 || q.indexOf(norm(p.title)) !== -1;
    })[0] || null;
  }

  function json(data) {
    return JSON.stringify(data, null, 2);
  }

  var tools = [
    {
      name: 'about_this_website',
      description: "Answers general questions about this website (\"what is this site?\", \"tell me about this website\", \"what can I find here?\"). " +
        "Returns who the site belongs to, what it covers, every page with a one-line description, how the site was built, which page is open now, " +
        "and the other tools available for specific questions. Returns structured data in one call.",
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      execute: function () {
        return Promise.all([
          loadPage('/index.html'),
          siteMap(),
          loadPage('/projects/this-site.html').then(function (d) { return text(d.querySelector('.dek')); }, function () { return null; })
        ]).then(function (r) {
          var home = r[0];
          return json({
            site: SITE_NAME + ' — personal website',
            url: location.origin + '/',
            owner: SITE_NAME + ', ' + text(home.querySelector('.masthead .role')),
            purpose: pageDescription(home),
            pages: r[1],
            howItWasBuilt: { summary: r[2], details: prettyUrl('/projects/this-site.html'), source: SOURCE_REPO },
            currentPage: { title: clean(document.title), url: prettyUrl(location.pathname) },
            tools: tools.map(function (t) { return { name: t.name, use: t.description.split('. ')[0].replace(/\.?$/, '.') }; }),
            toolAccess: {
              webmcp: status.api ? 'Registered via ' + status.api : 'WebMCP is not available in this browser',
              javascript: 'Call any tool from page JavaScript with await window.siteTools.call(name, input); it returns a JSON string.'
            },
            contact: LINKS
          });
        });
      }
    },
    {
      name: 'about_aj_wiebe',
      description: "Everything about AJ Wiebe in one call: bio, résumé / CV / work history, education, projects and portfolio, published papers and research interests, " +
        "and contact links (LinkedIn, GitHub). Use for \"who is AJ?\", \"tell me about him\", \"what does AJ do?\" or \"how can I contact him?\".",
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      execute: function () {
        return Promise.all([getBio(), getExperience(), listProjects(), getResearch()]).then(function (r) {
          var bio = r[0];
          return json({
            name: bio.name,
            role: bio.role,
            summary: bio.summary,
            bio: bio.bio,
            experience: r[1].experience,
            education: r[1].education,
            projects: r[2],
            research: r[3],
            contact: { linkedin: LINKS.linkedin, github: LINKS.github, website: location.origin + '/' }
          });
        });
      }
    },
    {
      name: 'get_current_page',
      description: "Returns the full content of the page currently open on this website, as structured sections (title, summary, headings, paragraphs). " +
        "Use to summarize, explain or answer questions about \"this page\" without reading the screen.",
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      execute: function () {
        return json(pageContent(document, location.pathname));
      }
    },
    {
      name: 'list_projects',
      description: "Lists everything AJ Wiebe has built (projects, portfolio, side projects, open-source work), each with title, one-line description and URL.",
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      execute: function () {
        return listProjects().then(json);
      }
    },
    {
      name: 'get_project',
      description: "Returns the full write-up of one of AJ Wiebe's projects: why it was built, how it works, what was learned, and code links. " +
        "Accepts the project's name, part of its name, or its slug (for example \"AI Briefing\", \"knowledge graph\" or \"aj-starter-gold\").",
      inputSchema: {
        type: 'object',
        properties: { project: { type: 'string', description: 'Project name, part of the name, or slug.' } },
        required: ['project']
      },
      annotations: { readOnlyHint: true },
      execute: function (input) {
        var query = input && (input.project || input.slug || input.name);
        return listProjects().then(function (projects) {
          var project = findProject(projects, query);
          if (!project) {
            return json({ error: 'No project matches "' + query + '".', projects: projects.map(function (p) { return p.title; }) });
          }
          return loadPage(new URL(project.url).pathname).then(function (doc) {
            var page = pageContent(doc, new URL(project.url).pathname);
            return json({
              title: text(doc.querySelector('h1.title')) || project.title,
              slug: project.slug,
              summary: page.summary || project.description,
              url: project.url,
              sections: page.sections
            });
          });
        });
      }
    },
    {
      name: 'get_experience',
      description: "Returns AJ Wiebe's résumé / CV: work history (roles, employers, dates, what he did in each role) and education. The full history is on LinkedIn.",
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      execute: function () {
        return getExperience().then(json);
      }
    },
    {
      name: 'list_research',
      description: "Returns AJ Wiebe's published research (papers, conference publications, master's thesis, with year, venue and links) and his current research interests.",
      inputSchema: { type: 'object', properties: {} },
      annotations: { readOnlyHint: true },
      execute: function () {
        return getResearch().then(json);
      }
    },
    {
      name: 'search_site',
      description: "Searches every page on this website for a word or phrase and returns matching pages with a short excerpt around each match.",
      inputSchema: {
        type: 'object',
        properties: { query: { type: 'string', description: 'Word or phrase to search for (case-insensitive).' } },
        required: ['query']
      },
      annotations: { readOnlyHint: true },
      execute: function (input) {
        var query = clean(input && input.query).toLowerCase();
        if (!query) return json({ error: 'query must not be empty' });
        return listProjects().then(function (projects) {
          var paths = PAGES.map(function (p) { return p.path; })
            .concat(projects.map(function (p) { return new URL(p.url).pathname; }));
          return Promise.all(paths.map(function (path) {
            return loadPage(path).then(function (doc) {
              var body = text(doc.querySelector('.wrap'));
              var idx = body.toLowerCase().indexOf(query);
              if (idx === -1) return null;
              var start = Math.max(0, idx - 80);
              return {
                title: clean(doc.title),
                url: prettyUrl(path),
                excerpt: (start > 0 ? '…' : '') + body.slice(start, idx + query.length + 80) + '…'
              };
            }, function () { return null; });
          }));
        }).then(function (results) {
          return json({ query: query, matches: results.filter(Boolean) });
        });
      }
    },
    {
      name: 'set_theme',
      description: 'Switches this website between its light and dark color themes. The choice is remembered for this visitor.',
      inputSchema: {
        type: 'object',
        properties: { theme: { type: 'string', enum: ['light', 'dark'] } },
        required: ['theme']
      },
      annotations: { readOnlyHint: false },
      execute: function (input) {
        var theme = input && input.theme;
        if (theme !== 'light' && theme !== 'dark') return json({ error: 'theme must be "light" or "dark"' });
        var btn = document.querySelector('[data-theme-btn="' + theme + '"]');
        if (btn) {
          btn.click();
        } else {
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('theme', theme); } catch (e) {}
        }
        return json({ theme: document.documentElement.getAttribute('data-theme') });
      }
    }
  ];

  // A failed call returns an error the agent can act on, instead of throwing.
  function safe(execute) {
    return function (input) {
      if (typeof input === 'string') {
        try { input = JSON.parse(input); } catch (e) { input = {}; }
      }
      return Promise.resolve().then(function () { return execute(input || {}); }).catch(function (err) {
        return json({
          error: String((err && err.message) || err),
          fallback: 'The page content is still available at ' + prettyUrl(location.pathname) + '. Other pages: ' +
            PAGES.map(function (p) { return prettyUrl(p.path); }).join(', ')
        });
      });
    };
  }

  var wrapped = tools.map(function (tool) {
    return Object.assign({}, tool, { execute: safe(tool.execute) });
  });
  var status = { api: canRegister ? api : null, registered: [], failed: [] };
  var root = document.documentElement;

  window.siteTools = {
    webmcp: status,
    list: function () {
      return wrapped.map(function (t) {
        return { name: t.name, description: t.description, inputSchema: t.inputSchema, annotations: t.annotations };
      });
    },
    call: function (name, input) {
      var tool = wrapped.filter(function (t) { return t.name === name; })[0];
      if (!tool) {
        return Promise.resolve(json({ error: 'Unknown tool: ' + name, tools: wrapped.map(function (t) { return t.name; }) }));
      }
      return tool.execute(input);
    }
  };

  if (!canRegister) {
    root.setAttribute('data-webmcp', 'unavailable');
    return;
  }

  root.setAttribute('data-webmcp', 'pending');
  Promise.all(wrapped.map(function (tool) {
    return Promise.resolve().then(function () { return mc.registerTool(tool); }).then(function () {
      status.registered.push(tool.name);
    }, function (err) {
      status.failed.push(tool.name);
      console.warn('WebMCP: could not register ' + tool.name, err);
    });
  })).then(function () {
    root.setAttribute('data-webmcp',
      !status.failed.length ? 'registered' : status.registered.length ? 'partial' : 'failed');
  });
})();
</script>
