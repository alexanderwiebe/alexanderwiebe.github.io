<script>
// WebMCP tools specific to this site, added to the quarto-webmcp extension's site and post tools
// (_extensions/alexanderwiebe/webmcp). They read the site's own rendered pages, so they stay in sync
// with the .qmd files. Settings for the extension's tools are under `webmcp:` in _quarto.yml.
(function () {
  var LINKS = {
    linkedin: 'https://www.linkedin.com/in/softwarebyaj',
    github: 'https://github.com/alexanderwiebe'
  };

  function addSiteTools(t) {
    function page(path) { return t.loadPage(t.absUrl(path)); }

    function listProjects() {
      return page('projects/').then(function (doc) {
        return Array.prototype.map.call(doc.querySelectorAll('.project-row'), function (row) {
          var link = row.querySelector('.row-title');
          var url = t.absUrl(link.getAttribute('href'));
          var slug = new URL(url).pathname.replace(/^.*\/projects\//, '').replace(/\.html$/, '');
          return { slug: slug, path: 'projects/' + slug + '.html', title: t.text(link), description: t.text(row.querySelector('.row-desc')), url: url };
        });
      });
    }

    function getExperience() {
      return page('resume.html').then(function (doc) {
        var result = { experience: [], education: [], fullHistory: LINKS.linkedin };
        var section = null;
        Array.prototype.forEach.call(doc.querySelector('.wrap').children, function (el) {
          if (el.matches('.section-label')) section = t.text(el).toLowerCase();
          if (!el.matches('.pub-row')) return;
          var entry = {
            dates: t.text(el.querySelector('.pub-meta')),
            title: t.text(el.querySelector('.pub-title')),
            description: t.text(el.querySelector('.pub-authors'))
          };
          if (section === 'education') result.education.push(entry);
          else result.experience.push(entry);
        });
        return result;
      });
    }

    function getResearch() {
      return page('research.html').then(function (doc) {
        var pubs = Array.prototype.map.call(doc.querySelectorAll('.pub-row'), function (row) {
          var meta = row.querySelector('.pub-meta').innerHTML.split(/<br\s*\/?>/i).map(function (s) {
            return s.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
          });
          var link = row.querySelector('.pub-title a');
          return {
            year: meta[0],
            venue: meta[1] || null,
            title: t.text(row.querySelector('.pub-title')),
            details: t.text(row.querySelector('.pub-authors')),
            url: link ? t.absUrl(link.getAttribute('href')) : null
          };
        });
        var topics = Array.prototype.map.call(doc.querySelectorAll('.topic-list li'), t.text);
        return { summary: t.text(doc.querySelector('.wrap > p')), publications: pubs, currentTopics: topics };
      });
    }

    function getBio() {
      return page('about.html').then(function (doc) {
        return {
          name: 'AJ Wiebe',
          role: t.text(doc.querySelector('.masthead .role')),
          summary: t.text(doc.querySelector('.dek')),
          bio: t.sections(doc)
        };
      });
    }

    t.add([
      {
        name: 'about_aj_wiebe',
        description: "Everything about AJ Wiebe in one call: bio, résumé / CV / work history, education, projects and portfolio, published papers and research interests, " +
          "and contact links (LinkedIn, GitHub). Use for \"who is AJ?\", \"tell me about him\", \"what does AJ do?\" or \"how can I contact him?\".",
        annotations: { readOnlyHint: true },
        execute: function () {
          return Promise.all([getBio(), getExperience(), listProjects(), getResearch()]).then(function (r) {
            return {
              name: r[0].name,
              role: r[0].role,
              summary: r[0].summary,
              bio: r[0].bio,
              experience: r[1].experience,
              education: r[1].education,
              projects: r[2].map(function (p) { return { title: p.title, description: p.description, url: p.url }; }),
              research: r[3],
              contact: { linkedin: LINKS.linkedin, github: LINKS.github, website: t.absUrl('') }
            };
          });
        }
      },
      {
        name: 'list_projects',
        description: 'Lists everything AJ Wiebe has built (projects, portfolio, side projects, open-source work), each with title, one-line description and URL.',
        annotations: { readOnlyHint: true },
        execute: function () {
          return listProjects().then(function (projects) {
            return projects.map(function (p) { return { slug: p.slug, title: p.title, description: p.description, url: p.url }; });
          });
        }
      },
      {
        name: 'get_project',
        description: "Returns the full write-up of one of AJ Wiebe's projects: why it was built, how it works, what was learned, and code links. " +
          'Accepts the project\'s name, part of its name, or its slug (for example "AI Briefing", "knowledge graph" or "aj-starter-gold").',
        inputSchema: {
          type: 'object',
          properties: { project: { type: 'string', description: 'Project name, part of the name, or slug.' } },
          required: ['project']
        },
        annotations: { readOnlyHint: true },
        execute: function (input) {
          return listProjects().then(function (projects) {
            var project = t.findPage(projects, input.project);
            if (!project) return { error: 'No project matches "' + input.project + '".', projects: projects.map(function (p) { return p.title; }) };
            return t.loadPage(project.url).then(function (doc) {
              var content = t.pageContent(doc, project.url);
              return {
                title: t.text(doc.querySelector('h1.title')) || project.title,
                slug: project.slug,
                summary: t.text(doc.querySelector('.dek')) || project.description,
                url: project.url,
                sections: content.sections
              };
            });
          });
        }
      },
      {
        name: 'get_experience',
        description: "Returns AJ Wiebe's résumé / CV: work history (roles, employers, dates, what he did in each role) and education. The full history is on LinkedIn.",
        annotations: { readOnlyHint: true },
        execute: getExperience
      },
      {
        name: 'list_research',
        description: "Returns AJ Wiebe's published research (papers, conference publications, master's thesis, with year, venue and links) and his current research interests.",
        annotations: { readOnlyHint: true },
        execute: getResearch
      }
    ]);
  }

  if (window.siteTools && window.siteTools.add) addSiteTools(window.siteTools);
  else document.addEventListener('webmcp:ready', function (e) { addSiteTools(e.detail); });
})();
</script>
