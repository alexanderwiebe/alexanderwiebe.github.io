name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install '.[dev]'

      - name: Lint notebooks
        run: nbqa ruff notebooks/

      - name: Lint Python files
        run: ruff check .

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install '.[dev]'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Quarto extensions
        run: scripts/install-quarto-extensions.sh

      - name: Render
        run: quarto render

      - name: Check WebMCP output
        run: node scripts/check-webmcp.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
