project:
  type: website
  output-dir: _site
  resources:
    - llms.txt
  render:
    - "*"
    - "!notebooks/**"
    - "!docs/**"

website:
  title: "AJ Wiebe"
  site-url: "https://systemsbyaj.com"
  description: "Software engineer and researcher. Ontologies, knowledge graphs, AI agents, and what I'm building now."
  open-graph: true
  twitter-card: true
  page-navigation: false
  draft-mode: unlinked

format:
  html:
    theme: none
    css: styles.css
    toc: false
    anchor-sections: false
    title-block-banner: false
    include-in-header: _includes/theme-init.html
    include-after-body:
      - _includes/theme-toggle.html
      - _includes/splash.html
      - _includes/footer.html
      - _includes/webmcp.html
      - _includes/webmcp-post.html  # after webmcp.html: adds post tools via window.siteTools.add

filters:
  - _filters/writing-post.lua
