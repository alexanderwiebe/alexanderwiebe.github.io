project:
  type: website
  output-dir: _site
  resources:
    - llms.txt
  post-render: _extensions/alexanderwiebe/webmcp/webmcp-index.ts  # writes webmcp-index.json for the WebMCP tools
  render:
    - "*"
    - "!notebooks/**"
    - "!docs/**"

website:
  title: "AJ Wiebe"
  site-url: "https://systemsbyaj.com"
  description: "Software engineer and researcher. Ontologies, knowledge graphs, AI agents, and what I'm building now."
  open-graph: true
  twitter-card: true
  page-navigation: false
  draft-mode: unlinked

format:
  html:
    theme: none
    css: styles.css
    toc: false
    anchor-sections: false
    title-block-banner: false
    include-in-header: _includes/theme-init.html
    include-after-body:
      - _includes/theme-toggle.html
      - _includes/splash.html
      - _includes/footer.html
      - _includes/site-tools.html  # this site's own WebMCP tools, added to the extension's

filters:
  - _filters/writing-post.lua
  - webmcp

# WebMCP tools for agents, from the quarto-webmcp extension (pinned in quarto-extensions.txt).
# Writing posts' agent: frontmatter is documented in docs/agent-posts.md. Quarto Wizard completes and
# checks everything under extensions: webmcp: (the extension's _schema.yml).
extensions:
  webmcp:
    name: "AJ Wiebe"
    owner: "AJ Wiebe, Software Engineer and Principal Consultant"
    about: about.html
    posts: writing
    source: "https://github.com/alexanderwiebe/alexanderwiebe.github.io"
    links:
      linkedin: "https://www.linkedin.com/in/softwarebyaj"
      github: "https://github.com/alexanderwiebe"
    theme:
      light: "[data-theme-btn=light]"  # unquoted values: Pandoc would curl quotes in metadata
      dark: "[data-theme-btn=dark]"
    content:
      root: ".wrap"
      heading: ".section-label, h2.h2"
      skip: ".masthead, .crumb, h1.title, .dek, .post-dates, svg, style, script"
    # Origin-trial tokens are public by design (bound to one origin). Each browser ignores tokens that
    # aren't its own or don't match the current origin. Register / renew:
